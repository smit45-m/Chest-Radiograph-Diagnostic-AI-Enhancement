seed: 42
output_dir: outputs
checkpoint_dir: checkpoints

data:
  root: data/nih
  image_dir: data/nih/images_224
  manifest: data/nih/manifest.csv
  image_size: 224
  num_workers: 4
  # Official NIH patient-wise split. val is carved from train_val by patient.
  val_fraction: 0.1

model:
  name: densenet121
  pretrained: imagenet   # imagenet | none
  dropout: 0.25
  multi_sample_dropout: true

train:
  epochs: 14
  batch_size: 16          # RTX 4060 8 GB, AMP FP16, 224 px
  accum_steps: 2          # effective batch 32
  lr: 0.0001
  weight_decay: 0.00001
  warmup_epochs: 1
  min_lr: 0.000001
  amp: true
  clip_grad: 1.0
  early_stop_patience: 4
  # Asymmetric Loss (ICCV 2021) excels on severe NIH-14 class imbalance (Hernia 0.16%).
  loss_type: asl          # asl | focal | bce
  label_smoothing: 0.02
  use_pos_weight: true
  use_ema: true
  ema_decay: 0.995
  mixup_alpha: 0.25
  # Unfreeze with Layer-wise Learning Rate Decay (LLRD) after head warmup.
  freeze_backbone_epochs: 1

eval:
  batch_size: 32
  threshold: 0.5

serve:
  host: 0.0.0.0
  port: 8000
  max_batch: 8
  max_delay_ms: 12
  threshold: 0.50
  ensemble_mode: full     # full (DenseNet-121 All/NIH + ResNet-50 512px + PSPNet) | fast
